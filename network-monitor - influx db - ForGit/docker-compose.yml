services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb_container
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword123
      - DOCKER_INFLUXDB_INIT_ORG=network_org
      - DOCKER_INFLUXDB_INIT_BUCKET=network_bucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-admin-token-123456789
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: always

  monitor-app:
    build: .
    container_name: network_monitor_container
    ports:
      - "8000:8000"
      - "1161:1161/udp"
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=my-super-secret-admin-token-123456789
      - INFLUXDB_ORG=network_org
      - INFLUXDB_BUCKET=network_bucket
    depends_on:
      - influxdb
    volumes:
      - ./config:/app/config
    restart: always

volumes:
  influxdb_data:
